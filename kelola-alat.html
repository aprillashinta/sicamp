<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kelola Alat - SiCamp Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        sicamp: {
                            50: '#f0fdf4',
                            100: '#dcfce7',
                            200: '#bbf7d0',
                            600: '#16a34a',
                            700: '#15803d',
                            800: '#166534',
                        }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans antialiased min-h-screen flex">

    <!-- Kontainer Sidebar Admin Terpusat -->
    <aside id="sidebarAdmin" class="w-64 bg-slate-900 text-white h-screen flex flex-col justify-between shrink-0 fixed top-0 bottom-0 left-0 z-20"></aside>

    <!-- Content Area -->
    <main class="flex-grow ml-64 p-8">
        <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 mb-8">
            <div>
                <h2 class="text-2xl font-black text-slate-900 tracking-tight">Kelola Inventaris Alat</h2>
                <p class="text-xs text-slate-500 mt-1">Atur daftar peralatan sewa, penentuan harga, dan perbarui sisa stok barang.</p>
            </div>
            <button onclick="openModalTambahAlat()" class="px-5 py-2.5 bg-sicamp-700 hover:bg-sicamp-800 text-white font-bold text-xs rounded-xl shadow-lg shadow-sicamp-700/20 transition-all flex items-center gap-2 shrink-0 cursor-pointer">
                <i class="fa-solid fa-plus"></i> Tambah Peralatan Baru
            </button>
        </div>

        <div class="bg-white rounded-3xl border border-slate-200/80 shadow-xs overflow-hidden">
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse" id="tblPeralatanAdmin">
                    <thead>
                        <tr class="bg-slate-50 border-b border-slate-200/80 text-[11px] font-extrabold text-slate-400 uppercase tracking-wider">
                            <th class="py-4 px-6">Gambar</th>
                            <th class="py-4 px-6">ID Alat</th>
                            <th class="py-4 px-6">Nama Peralatan</th>
                            <th class="py-4 px-6">Kategori</th>
                            <th class="py-4 px-6">Harga Sewa / Hari</th>
                            <th class="py-4 px-6">Sisa Stok</th>
                            <th class="py-4 px-6 text-center">Aksi Admin</th>
                        </tr>
                    </thead>
                    <tbody class="divide-y divide-slate-100 text-xs text-slate-700 font-medium"></tbody>
                </table>
            </div>
        </div>
    </main>

    <!-- Modal Input Peralatan -->
    <div id="modalPeralatan" class="fixed inset-0 bg-slate-900/60 backdrop-blur-xs z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-white rounded-3xl max-w-lg w-full p-6 shadow-2xl border border-slate-100 space-y-4">
            <div class="flex items-center justify-between border-b border-slate-100 pb-3">
                <h3 id="modalAlatTitle" class="text-base font-bold text-slate-900">Tambah Peralatan Baru</h3>
                <button onclick="closeModalAlat()" class="w-8 h-8 rounded-full bg-slate-100 hover:bg-slate-200 text-slate-500 text-xs font-bold transition-all flex items-center justify-center">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>

            <form id="formPeralatan" onsubmit="savePeralatanHandler(event)" class="space-y-3">
                <input type="hidden" id="inputAlatId">

                <div>
                    <label class="block text-[11px] font-bold text-slate-600 mb-1">Nama Peralatan</label>
                    <input type="text" id="inputNamaAlat" required class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-xs font-semibold text-slate-800 focus:outline-none focus:border-sicamp-600" placeholder="Contoh: Tenda Dome 4P">
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-[11px] font-bold text-slate-600 mb-1">Kategori</label>
                        <select id="inputKategoriAlat" required class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-xs font-semibold text-slate-800 focus:outline-none focus:border-sicamp-600"></select>
                    </div>
                    <div>
                        <label class="block text-[11px] font-bold text-slate-600 mb-1">Harga Sewa / Hari (Rp)</label>
                        <input type="number" id="inputHargaAlat" required min="0" class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-xs font-semibold text-slate-800 focus:outline-none focus:border-sicamp-600" placeholder="50000">
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-[11px] font-bold text-slate-600 mb-1">Jumlah Stok</label>
                        <input type="number" id="inputStokAlat" required min="0" class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-xs font-semibold text-slate-800 focus:outline-none focus:border-sicamp-600" placeholder="5">
                    </div>
                    <div>
                        <label class="block text-[11px] font-bold text-slate-600 mb-1">URL Gambar Peralatan</label>
                        <input type="text" id="inputGambarAlat" class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-xs font-semibold text-slate-800 focus:outline-none focus:border-sicamp-600" placeholder="https://...">
                    </div>
                </div>

                <div>
                    <label class="block text-[11px] font-bold text-slate-600 mb-1">Deskripsi Singkat</label>
                    <textarea id="inputDeskripsiAlat" rows="3" class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-xs font-semibold text-slate-800 focus:outline-none focus:border-sicamp-600" placeholder="Tuliskan spesifikasi atau keunggulan alat..."></textarea>
                </div>

                <div class="pt-3 flex items-center justify-end gap-2 border-t border-slate-100">
                    <button type="button" onclick="closeModalAlat()" class="px-4 py-2.5 bg-slate-100 hover:bg-slate-200 text-slate-600 text-xs font-bold rounded-xl transition-all">Batal</button>
                    <button type="submit" class="px-5 py-2.5 bg-sicamp-700 hover:bg-sicamp-800 text-white text-xs font-bold rounded-xl shadow-md transition-all">Simpan Peralatan</button>
                </div>
            </form>
        </div>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
