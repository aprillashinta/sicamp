<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Masuk Akun - SiCamp OutdoorRent</title>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        sicamp: {
                            50: '#f0fdf4',
                            100: '#dcfce7',
                            500: '#22c55e',
                            600: '#16a34a',
                            700: '#15803d',
                            800: '#0e622f',
                        }
                    },
                    fontFamily: {
                        sans: ['Plus Jakarta Sans', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-[#faf5f0] min-h-screen flex items-center justify-center p-4 font-sans antialiased text-slate-800">

    <div class="w-full max-w-[420px] bg-white rounded-[36px] shadow-2xl shadow-stone-200/60 p-7 sm:p-8 border border-stone-100 my-6">
        
        <!-- Header Text Login (Presisi Sesuai Request) -->
        <div class="flex flex-col items-center text-center mb-6 pt-2">
            <!-- Judul utama -->
            <h1 class="text-2xl font-extrabold text-slate-900 tracking-tight">
                Selamat Datang di Si<span class="text-sicamp-700">Camp</span>
            </h1>
            
            <!-- Deskripsi (Warna abu-abu lembut text-slate-500, tidak hitam pekat) -->
            <p class="text-xs text-slate-500 font-medium mt-1.5 max-w-[280px] leading-relaxed">
                Sewa peralatan camping praktis untuk petualanganmu
            </p>
        </div>

        <!-- Tab Switcher (Masuk Akun / Daftar Akun Baru) -->
        <div class="bg-[#f5efea] p-1.5 rounded-full flex items-center mb-6">
            <a href="login.html" class="flex-1 py-2.5 text-center text-xs font-bold text-sicamp-800 bg-white rounded-full shadow-sm flex items-center justify-center gap-1.5">
                <i class="fa-solid fa-right-to-bracket text-sicamp-700"></i> Masuk Akun
            </a>
            <a href="register.html" class="flex-1 py-2.5 text-center text-xs font-semibold text-slate-400 hover:text-slate-600 transition-colors flex items-center justify-center gap-1.5">
                <i class="fa-solid fa-user-plus"></i> Daftar Akun Baru
            </a>
        </div>

        <!-- Form Login -->
        <form id="loginForm" class="space-y-4">
            <div>
                <div class="flex justify-between items-center mb-1.5">
                    <label class="block text-xs font-bold text-slate-700">Email atau Nomor WhatsApp</label>
                    <span class="text-[10px] text-emerald-600 font-semibold">Terverifikasi</span>
                </div>
                <div class="relative">
                    <i class="fa-regular fa-envelope absolute left-4 top-3.5 text-slate-400 text-sm"></i>
                    <input type="text" id="loginUser" required placeholder="nama@email.com / 08123456789" class="w-full pl-11 pr-4 py-3 bg-[#f7f2ed] focus:bg-white border border-transparent focus:border-sicamp-600 rounded-full text-xs font-medium text-slate-800 placeholder-slate-400 focus:outline-none transition-all">
                </div>
            </div>

            <div>
                <label class="block text-xs font-bold text-slate-700 mb-1.5">Kata Sandi</label>
                <div class="relative">
                    <i class="fa-solid fa-lock absolute left-4 top-3.5 text-slate-400 text-sm"></i>
                    <input type="password" id="loginPass" required placeholder="Minimal 8 karakter" class="w-full pl-11 pr-11 py-3 bg-[#f7f2ed] focus:bg-white border border-transparent focus:border-sicamp-600 rounded-full text-xs font-medium text-slate-800 placeholder-slate-400 focus:outline-none transition-all">
                    <button type="button" onclick="togglePassword('loginPass', this)" class="absolute right-4 top-3.5 text-slate-400 hover:text-slate-600 text-sm">
                        <i class="fa-regular fa-eye"></i>
                    </button>
                </div>
            </div>

            <div class="flex items-center justify-between text-xs pt-1">
                <label class="flex items-center gap-2 text-slate-600 cursor-pointer">
                    <input type="checkbox" class="w-3.5 h-3.5 rounded text-sicamp-700 focus:ring-sicamp-600 border-slate-300">
                    <span>Ingat Saya</span>
                </label>
                <a href="#" onclick="alert('Silakan hubungi admin di WhatsApp untuk reset password.')" class="font-bold text-sicamp-700 hover:underline">Lupa Kata Sandi?</a>
            </div>

            <button type="submit" class="w-full py-3.5 bg-sicamp-700 hover:bg-sicamp-800 active:scale-[0.98] text-white font-bold text-xs rounded-full shadow-lg shadow-sicamp-700/25 transition-all flex items-center justify-center gap-2 mt-2">
                Masuk Sekarang <i class="fa-solid fa-arrow-right"></i>
            </button>
        </form>

        <!-- Footer Link -->
        <div class="text-center text-xs text-slate-500 mt-8 pt-4 border-t border-slate-100">
            Belum punya akun? <a href="register.html" class="font-bold text-sicamp-700 hover:underline">Daftar sekarang</a>
        </div>
    </div>

    <script>
        function togglePassword(inputId, btn) {
            const input = document.getElementById(inputId);
            const icon = btn.querySelector('i');
            if (input.type === 'password') {
                input.type = 'text';
                icon.classList.remove('fa-eye');
                icon.classList.add('fa-eye-slash');
            } else {
                input.type = 'password';
                icon.classList.remove('fa-eye-slash');
                icon.classList.add('fa-eye');
            }
        }
    </script>
    <script src="js/app.js"></script>
</body>
</html>
