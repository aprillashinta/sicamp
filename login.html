<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Masuk Akun - SiCamp OutdoorRent</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        sicamp: {
                            50: '#f0fdf4',
                            100: '#dcfce7',
                            500: '#22c55e',
                            600: '#16a34a',
                            700: '#15803d',
                            800: '#0e622f'
                        }
                    },
                    fontFamily: {
                        sans: ['Plus Jakarta Sans', 'sans-serif']
                    }
                }
            }
        };
    </script>

    <!-- Google Fonts -->
    <link
        href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >

    <!-- Font Awesome -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    >

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        /* ======================================
           TOAST NOTIFICATION
        ====================================== */

        .toast-container {
            position: fixed;
            top: 22px;
            right: 24px;
            z-index: 99999;

            width: 360px;
            max-width: calc(100vw - 32px);

            pointer-events: none;
        }

        .toast {
            display: flex;
            align-items: flex-start;
            gap: 12px;

            position: relative;
            width: 100%;

            padding: 14px 42px 14px 14px;

            background: #fffdfa;
            border: 1px solid #eee8df;
            border-left: 3px solid #b94a48;
            border-radius: 13px;

            box-shadow:
                0 12px 32px rgba(36, 43, 37, 0.08),
                0 3px 8px rgba(36, 43, 37, 0.03);

            opacity: 0;
            visibility: hidden;
            transform: translateY(-10px);

            transition:
                opacity 220ms ease,
                transform 220ms ease,
                visibility 220ms ease;

            pointer-events: none;
        }

        .toast.show {
            opacity: 1;
            visibility: visible;
            transform: translateY(0);

            pointer-events: auto;
        }

        .toast.error {
            border-left-color: #b94a48;
        }

        .toast.success {
            border-left-color: #327653;
        }

        .toast.warning {
            border-left-color: #b18131;
        }

        .toast.info {
            border-left-color: #587b9e;
        }

        /* Ikon toast */

        .toast-icon {
            width: 35px;
            height: 35px;
            flex-shrink: 0;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 11px;
            font-size: 14px;
        }

        .toast.error .toast-icon {
            color: #ad413e;
            background: #f9eae7;
        }

        .toast.success .toast-icon {
            color: #327653;
            background: #e9f3ec;
        }

        .toast.warning .toast-icon {
            color: #986b20;
            background: #faf1dc;
        }

        .toast.info .toast-icon {
            color: #587b9e;
            background: #eaf0f6;
        }

        /* Konten toast */

        .toast-content {
            flex: 1;
            min-width: 0;
            padding-top: 1px;
        }

        .toast-title {
            margin: 0;

            color: #29352e;
            font-size: 12px;
            font-weight: 800;
            line-height: 1.6;
        }

        .toast-message {
            margin: 3px 0 0;

            color: #737b74;
            font-size: 10.5px;
            font-weight: 500;
            line-height: 1.7;

            overflow-wrap: anywhere;
        }

        /* Tombol tutup */

        .toast-close {
            position: absolute;
            top: 9px;
            right: 9px;

            display: flex;
            align-items: center;
            justify-content: center;

            width: 27px;
            height: 27px;

            padding: 0;
            border: none;
            border-radius: 8px;

            background: transparent;
            color: #9a9f98;

            font-size: 12px;
            cursor: pointer;

            transition:
                background 180ms ease,
                color 180ms ease;
        }

        .toast-close:hover {
            background: #f2eee8;
            color: #374139;
        }

        .toast-close:focus-visible {
            outline: 2px solid #327653;
            outline-offset: 2px;
        }

        @media (max-width: 640px) {
            .toast-container {
                top: 14px;
                right: 12px;
                width: calc(100vw - 24px);
                max-width: 380px;
            }

            .toast {
                gap: 10px;
                padding: 13px 39px 13px 12px;
            }

            .toast-icon {
                width: 32px;
                height: 32px;
                font-size: 13px;
            }

            .toast-title {
                font-size: 11px;
            }

            .toast-message {
                font-size: 10px;
            }

            .toast-close {
                top: 7px;
                right: 7px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .toast {
                transition: none;
            }
        }
    </style>
</head>

<body class="bg-[#faf5f0] min-h-screen flex items-center justify-center p-4 font-sans antialiased text-slate-800">

    <!-- ======================================
         TOAST NOTIFICATION
    ======================================= -->

    <div
        class="toast-container"
        aria-live="polite"
        aria-atomic="true"
    >
        <div
            id="sicampToast"
            class="toast error"
            role="status"
            aria-hidden="true"
        >
            <div id="toastIcon" class="toast-icon">
                <i class="fa-solid fa-circle-exclamation"></i>
            </div>

            <div class="toast-content">
                <h2 id="toastTitle" class="toast-title">
                    Tidak Dapat Masuk
                </h2>

                <p id="toastMessage" class="toast-message">
                    Username atau email dan kata sandi tidak sesuai.
                </p>
            </div>

            <button
                type="button"
                id="toastClose"
                class="toast-close"
                aria-label="Tutup notifikasi"
                title="Tutup"
            >
                <i class="fa-solid fa-xmark"></i>
            </button>
        </div>
    </div>

    <!-- ======================================
         LOGIN CARD
    ======================================= -->

    <div class="w-full max-w-[420px] bg-white rounded-[36px] shadow-2xl shadow-stone-200/60 p-7 sm:p-8 border border-stone-100 my-6">

        <!-- Header -->

        <div class="flex flex-col items-center text-center mb-6 pt-2">
            <h1 class="text-2xl font-extrabold text-slate-900 tracking-tight">
                Selamat Datang di Si<span class="text-sicamp-700">Camp</span>
            </h1>

            <p class="text-xs text-slate-500 font-medium mt-1.5 max-w-[280px] leading-relaxed">
                Sewa peralatan camping praktis untuk petualanganmu
            </p>
        </div>

        <!-- Tab Switcher -->

        <div class="bg-[#f5efea] p-1.5 rounded-full flex items-center mb-6">
            <a
                href="login.html"
                class="flex-1 py-2.5 text-center text-xs font-bold text-sicamp-800 bg-white rounded-full shadow-sm flex items-center justify-center gap-1.5 no-underline"
            >
                <i class="fa-solid fa-right-to-bracket text-sicamp-700"></i>
                Masuk Akun
            </a>

            <a
                href="register.html"
                class="flex-1 py-2.5 text-center text-xs font-semibold text-slate-400 hover:text-slate-600 transition-colors flex items-center justify-center gap-1.5 no-underline"
            >
                <i class="fa-solid fa-user-plus"></i>
                Daftar Akun Baru
            </a>
        </div>

        <!-- Form Login -->

        <form id="loginForm" class="space-y-4">

            <div>
                <div class="flex justify-between items-center mb-1.5">
                    <label
                        for="loginUser"
                        class="block text-xs font-bold text-slate-700"
                    >
                        Email / Username
                    </label>

                    <span class="text-[10px] text-emerald-600 font-semibold">
                        Terverifikasi
                    </span>
                </div>

                <div class="relative">
                    <i class="fa-regular fa-envelope absolute left-4 top-3.5 text-slate-400 text-sm"></i>

                    <input
                        type="text"
                        id="loginUser"
                        name="username"
                        required
                        autocomplete="username"
                        placeholder="Masukkan email atau username"
                        class="w-full pl-11 pr-4 py-3 bg-[#f7f2ed] focus:bg-white border border-transparent focus:border-sicamp-600 rounded-full text-xs font-medium text-slate-800 placeholder-slate-400 focus:outline-none transition-all"
                    >
                </div>
            </div>

            <div>
                <label
                    for="loginPass"
                    class="block text-xs font-bold text-slate-700 mb-1.5"
                >
                    Kata Sandi
                </label>

                <div class="relative">
                    <i class="fa-solid fa-lock absolute left-4 top-3.5 text-slate-400 text-sm"></i>

                    <input
                        type="password"
                        id="loginPass"
                        name="password"
                        required
                        autocomplete="current-password"
                        placeholder="Masukkan kata sandi"
                        class="w-full pl-11 pr-11 py-3 bg-[#f7f2ed] focus:bg-white border border-transparent focus:border-sicamp-600 rounded-full text-xs font-medium text-slate-800 placeholder-slate-400 focus:outline-none transition-all"
                    >

                    <button
                        type="button"
                        id="togglePassword"
                        aria-label="Tampilkan kata sandi"
                        class="absolute right-4 top-3.5 text-slate-400 hover:text-slate-600 text-sm"
                    >
                        <i class="fa-regular fa-eye"></i>
                    </button>
                </div>
            </div>

            <!-- Remember Me -->

            <div class="flex items-center justify-between text-xs pt-1">
                <label class="flex items-center gap-2 text-slate-600 cursor-pointer">
                    <input
                        type="checkbox"
                        id="rememberMe"
                        class="w-3.5 h-3.5 rounded text-sicamp-700 focus:ring-sicamp-600 border-slate-300"
                    >

                    <span>Ingat Saya</span>
                </label>

                <a
                    href="#"
                    id="forgotPassword"
                    class="font-bold text-sicamp-700 hover:underline"
                >
                    Lupa Kata Sandi?
                </a>
            </div>

            <!-- Submit -->

            <button
                type="submit"
                id="loginButton"
                class="w-full py-3.5 bg-sicamp-700 hover:bg-sicamp-800 active:scale-[0.98] text-white font-bold text-xs rounded-full shadow-lg shadow-sicamp-700/25 transition-all flex items-center justify-center gap-2 mt-2 cursor-pointer"
            >
                Masuk Sekarang
                <i class="fa-solid fa-arrow-right"></i>
            </button>
        </form>

        <!-- Footer -->

        <div class="text-center text-xs text-slate-500 mt-8 pt-4 border-t border-slate-100">
            Belum punya akun?

            <a
                href="register.html"
                class="font-bold text-sicamp-700 hover:underline"
            >
                Daftar sekarang
            </a>
        </div>
    </div>

    <script>
        /* ======================================
           TOAST NOTIFICATION
           Auto-dismiss 4 detik + tombol X
        ====================================== */

        let toastTimer = null;
        let toastAnimationTimer = null;

        function hideToast() {
            const toast = document.getElementById('sicampToast');

            clearTimeout(toastTimer);
            clearTimeout(toastAnimationTimer);

            toast.classList.remove('show');

            toastAnimationTimer = setTimeout(() => {
                if (!toast.classList.contains('show')) {
                    toast.setAttribute('aria-hidden', 'true');
                }
            }, 250);
        }

        function showToast(
            message,
            type = 'error',
            title = '',
            duration = 4000
        ) {
            const toast = document.getElementById('sicampToast');
            const toastIcon = document.getElementById('toastIcon');
            const toastTitle = document.getElementById('toastTitle');
            const toastMessage = document.getElementById('toastMessage');

            const toastTypes = {
                error: {
                    title: 'Tidak Dapat Masuk',
                    icon: 'fa-circle-exclamation'
                },
                success: {
                    title: 'Berhasil',
                    icon: 'fa-circle-check'
                },
                warning: {
                    title: 'Periksa Kembali',
                    icon: 'fa-triangle-exclamation'
                },
                info: {
                    title: 'Informasi',
                    icon: 'fa-circle-info'
                }
            };

            const selectedType = toastTypes[type] || toastTypes.info;

            // Reset timer sebelumnya.
            clearTimeout(toastTimer);
            clearTimeout(toastAnimationTimer);

            // Atur tipe dan isi notifikasi.
            toast.className = 'toast ' + type;

            toastIcon.innerHTML =
                '<i class="fa-solid ' + selectedType.icon + '"></i>';

            toastTitle.textContent = title || selectedType.title;
            toastMessage.textContent = message;

            toast.setAttribute('aria-hidden', 'false');

            // Animasi masuk.
            requestAnimationFrame(() => {
                toast.classList.add('show');
            });

            // Hilang otomatis setelah durasi yang ditentukan.
            toastTimer = setTimeout(() => {
                hideToast();
            }, duration);
        }

        // Tutup toast menggunakan tombol X.
        document
            .getElementById('toastClose')
            .addEventListener('click', hideToast);

        /* ======================================
           TOGGLE PASSWORD
        ====================================== */

        document
            .getElementById('togglePassword')
            .addEventListener('click', function () {
                const passwordInput =
                    document.getElementById('loginPass');

                const icon = this.querySelector('i');

                if (passwordInput.type === 'password') {
                    passwordInput.type = 'text';

                    icon.classList.remove('fa-eye');
                    icon.classList.add('fa-eye-slash');

                    this.setAttribute(
                        'aria-label',
                        'Sembunyikan kata sandi'
                    );
                } else {
                    passwordInput.type = 'password';

                    icon.classList.remove('fa-eye-slash');
                    icon.classList.add('fa-eye');

                    this.setAttribute(
                        'aria-label',
                        'Tampilkan kata sandi'
                    );
                }
            });

        /* ======================================
           LOGIN
        ====================================== */

        document
            .getElementById('loginForm')
            .addEventListener('submit', async function (event) {
                event.preventDefault();

                const username = document
                    .getElementById('loginUser')
                    .value
                    .trim();

                const password =
                    document.getElementById('loginPass').value;

                const rememberMe =
                    document.getElementById('rememberMe').checked;

                const button =
                    document.getElementById('loginButton');

                const originalButtonHTML = button.innerHTML;

                if (!username || !password) {
                    showToast(
                        'Masukkan username atau email beserta kata sandi.',
                        'warning',
                        'Data Belum Lengkap'
                    );

                    return;
                }

                button.disabled = true;

                button.innerHTML =
                    '<i class="fa-solid fa-spinner fa-spin"></i> Memproses...';

                try {
                    const response = await fetch(
                        'api/api_auth.php?action=login',
                        {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json',
                                'Accept': 'application/json'
                            },
                            body: JSON.stringify({
                                username: username,
                                password: password
                            })
                        }
                    );

                    let result;

                    try {
                        result = await response.json();
                    } catch (error) {
                        console.error(
                            'Respons API bukan JSON valid:',
                            error
                        );

                        showToast(
                            'Server mengirim respons yang tidak valid. Periksa konfigurasi API SiCamp.',
                            'error',
                            'Respons Server Tidak Valid'
                        );

                        return;
                    }

                    // Kesalahan autentikasi.
                    if (
                        response.status === 401 ||
                        response.status === 403
                    ) {
                        showToast(
                            'Username atau email dan kata sandi tidak sesuai. Silakan periksa kembali.',
                            'error',
                            'Tidak Dapat Masuk'
                        );

                        return;
                    }

                    // Kesalahan server.
                    if (!response.ok) {
                        console.error('Kesalahan API:', result);

                        showToast(
                            'Layanan SiCamp mengalami kendala saat memproses permintaan. Silakan coba kembali.',
                            'error',
                            'Layanan Tidak Tersedia'
                        );

                        return;
                    }

                    // Login berhasil.
                    if (
                        String(result.status).toLowerCase() === 'success' &&
                        result.user
                    ) {
                        const user = result.user;

                        const userData = JSON.stringify(user);

                        // Simpan sesi sesuai pilihan pengguna.
                        if (rememberMe) {
                            localStorage.setItem(
                                'session_user',
                                userData
                            );

                            sessionStorage.removeItem('session_user');
                        } else {
                            sessionStorage.setItem(
                                'session_user',
                                userData
                            );

                            localStorage.removeItem('session_user');
                        }

                        const nama =
                            user.nama ||
                            user.nama_admin ||
                            user.nama_pelanggan ||
                            user.username ||
                            'Pengguna';

                        const destination =
                            user.role === 'admin'
                                ? 'dashboard.html'
                                : 'index.html';

                        showToast(
                            'Selamat datang, ' + nama + '.',
                            'success',
                            'Login Berhasil',
                            1200
                        );

                        setTimeout(() => {
                            window.location.href = destination;
                        }, 1000);

                        return;
                    }

                    // API mengembalikan status gagal.
                    const message = String(
                        result.message || ''
                    ).toLowerCase();

                    const isAuthError =
                        message.includes('password') ||
                        message.includes('kata sandi') ||
                        message.includes('username') ||
                        message.includes('email') ||
                        message.includes('akun') ||
                        message.includes('tidak ditemukan') ||
                        message.includes('salah');

                    if (isAuthError) {
                        showToast(
                            'Username atau email dan kata sandi tidak sesuai. Silakan periksa kembali.',
                            'error',
                            'Tidak Dapat Masuk'
                        );
                    } else {
                        showToast(
                            result.message ||
                            'Permintaan belum dapat diproses. Silakan coba kembali.',
                            'error',
                            'Permintaan Gagal'
                        );
                    }

                } catch (error) {
                    console.error('Kesalahan login:', error);

                    showToast(
                        'Tidak dapat menghubungi server SiCamp. Pastikan server PHP berjalan dan koneksi database tersedia.',
                        'error',
                        'Server Tidak Dapat Dihubungi'
                    );

                } finally {
                    button.disabled = false;
                    button.innerHTML = originalButtonHTML;
                }
            });

        /* ======================================
           LUPA KATA SANDI
        ====================================== */

        document
            .getElementById('forgotPassword')
            .addEventListener('click', function (event) {
                event.preventDefault();

                showToast(
                    'Silakan hubungi administrator SiCamp untuk mendapatkan bantuan mengatur ulang kata sandi.',
                    'info',
                    'Bantuan Kata Sandi'
                );
            });
    </script>

    <script src="js/app.js"></script>

</body>
</html>
