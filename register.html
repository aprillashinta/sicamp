<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daftar Akun Baru - SiCamp OutdoorRent</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        sicamp: {
                            50: '#f0fdf4',
                            100: '#dcfce7',
                            200: '#bbf7d0',
                            500: '#22c55e',
                            600: '#16a34a',
                            700: '#15803d',
                            800: '#0e622f'
                        }
                    },
                    fontFamily: {
                        sans: ['Plus Jakarta Sans', 'sans-serif']
                    }
                }
            }
        };
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body{font-family:'Plus Jakarta Sans',sans-serif}
        .register-input{width:100%;padding:12px 16px 12px 42px;background:#f7f2ed;border:1px solid transparent;border-radius:9999px;font-size:12px;font-weight:500;color:#1e293b;outline:none;transition:all .2s}
        .register-input:focus{background:#fff;border-color:#16a34a}
        .register-input::placeholder{color:#94a3b8}
        .register-label{display:block;margin-bottom:6px;font-size:12px;font-weight:700;color:#334155}
        .register-field{min-width:0}
        .register-icon{position:absolute;left:16px;top:50%;transform:translateY(-50%);font-size:13px;color:#94a3b8;pointer-events:none}
        .register-toast{position:fixed;top:20px;right:20px;z-index:100;display:none;width:340px;max-width:calc(100vw - 32px);padding:15px;background:white;border:1px solid #e7e5e4;border-radius:14px;box-shadow:0 12px 35px #00000012}
        .register-toast.show{display:block}
        @media(max-width:639px){.register-card{padding:24px 20px}.register-grid{grid-template-columns:minmax(0,1fr)}}
    </style>
</head>
<body class="bg-[#faf5f0] min-h-screen flex items-center justify-center p-4 font-sans antialiased text-slate-800">

    <div class="w-full max-w-[760px] bg-white rounded-[32px] shadow-2xl shadow-stone-200/60 p-6 sm:p-8 border border-stone-100 my-4 register-card">

        <div class="text-center mb-5">
            <a href="index.html" class="inline-block">
                <span class="text-2xl font-black text-slate-900 tracking-tight leading-none block">Si<span class="text-sicamp-700">Camp</span></span>
            </a>
            <p class="text-xs text-slate-500 font-medium mt-1">Penyewaan Peralatan Camping</p>
        </div>

        <div class="bg-[#f5efea] p-1.5 rounded-full flex items-center mb-6 max-w-[440px] mx-auto">
            <a href="login.html" class="flex-1 py-2.5 text-center text-xs font-semibold text-slate-400 hover:text-slate-600 transition-colors flex items-center justify-center gap-1.5">
                <i class="fa-solid fa-right-to-bracket"></i> Masuk Akun
            </a>
            <a href="register.html" class="flex-1 py-2.5 text-center text-xs font-bold text-sicamp-800 bg-white rounded-full shadow-sm flex items-center justify-center gap-1.5">
                <i class="fa-solid fa-user-plus text-sicamp-700"></i> Daftar Akun Baru
            </a>
        </div>

        <div class="mb-5">
            <h1 class="text-lg font-extrabold text-slate-900">Buat akun baru</h1>
            <p class="text-xs text-slate-500 mt-1">Lengkapi data untuk mulai menyewa peralatan camping.</p>
        </div>

        <form id="registerForm">
            <div class="register-grid grid grid-cols-2 gap-x-5 gap-y-4">

                <div class="register-field">
                    <label for="regNama" class="register-label">Nama Lengkap <span class="text-rose-500">*</span></label>
                    <div class="relative">
                        <i class="register-icon fa-regular fa-user"></i>
                        <input type="text" id="regNama" name="nama" required autocomplete="name" placeholder="Masukkan nama lengkap" class="register-input">
                    </div>
                </div>

                <div class="register-field">
                    <label for="regEmail" class="register-label">Alamat Email <span class="text-rose-500">*</span></label>
                    <div class="relative">
                        <i class="register-icon fa-regular fa-envelope"></i>
                        <input type="email" id="regEmail" name="email" required autocomplete="email" placeholder="nama@petualang.id" class="register-input">
                    </div>
                </div>

                <div class="register-field">
                    <label for="regPhone" class="register-label">Nomor WhatsApp Aktif <span class="text-rose-500">*</span></label>
                    <div class="relative">
                        <i class="register-icon fa-solid fa-mobile-screen"></i>
                        <input type="tel" id="regPhone" name="telepon" required autocomplete="tel" placeholder="081234567890" class="register-input">
                    </div>
                    <p class="text-[10px] leading-relaxed text-slate-400 mt-1.5">
                        <i class="fa-solid fa-circle-info text-sicamp-600"></i>
                        Untuk notifikasi status booking.
                    </p>
                </div>

                <div class="register-field">
                    <label for="regAlamat" class="register-label">Alamat Lengkap <span class="text-rose-500">*</span></label>
                    <div class="relative">
                        <i class="register-icon fa-solid fa-location-dot" style="top:18px;transform:none"></i>
                        <textarea id="regAlamat" name="alamat" required autocomplete="street-address" rows="2" placeholder="Masukkan alamat lengkap" class="register-input rounded-2xl resize-y"></textarea>
                    </div>
                </div>

                <div class="register-field">
                    <label for="regPass" class="register-label">Buat Kata Sandi <span class="text-rose-500">*</span></label>
                    <div class="relative">
                        <i class="register-icon fa-solid fa-lock"></i>
                        <input type="password" id="regPass" name="password" required minlength="8" autocomplete="new-password" placeholder="Minimal 8 karakter" class="register-input pr-12">
                        <button type="button" onclick="togglePassword('regPass',this)" class="absolute right-4 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600 text-sm" aria-label="Tampilkan kata sandi">
                            <i class="fa-regular fa-eye"></i>
                        </button>
                    </div>
                    <div class="flex justify-between items-center text-[10px] text-slate-400 mt-1.5 gap-2">
                        <span>Kekuatan kata sandi</span>
                        <span id="passwordStrength" class="text-slate-500 font-semibold">Belum diisi</span>
                    </div>
                </div>

                <div class="register-field">
                    <label for="regKonfirmasi" class="register-label">Konfirmasi Kata Sandi <span class="text-rose-500">*</span></label>
                    <div class="relative">
                        <i class="register-icon fa-solid fa-shield-halved"></i>
                        <input type="password" id="regKonfirmasi" name="konfirmasi_password" required minlength="8" autocomplete="new-password" placeholder="Ulangi kata sandi" class="register-input pr-12">
                        <button type="button" onclick="togglePassword('regKonfirmasi',this)" class="absolute right-4 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600 text-sm" aria-label="Tampilkan konfirmasi kata sandi">
                            <i class="fa-regular fa-eye"></i>
                        </button>
                    </div>
                </div>

            </div>

            <div class="mt-5">
                <label class="flex items-start gap-2 text-xs text-slate-600 cursor-pointer">
                    <input id="regPersetujuan" type="checkbox" required class="mt-0.5 w-3.5 h-3.5 shrink-0 rounded accent-green-700 border-slate-300">
                    <span class="leading-relaxed">Saya menyetujui <a href="#" class="font-bold text-sicamp-700 hover:underline">Syarat & Ketentuan Sewa SiCamp</a> serta <a href="#" class="font-bold text-sicamp-700 hover:underline">Kebijakan Privasi</a> penggunaan data.</span>
                </label>
            </div>

            <button id="registerSubmit" type="submit" class="w-full py-3.5 bg-sicamp-700 hover:bg-sicamp-800 active:scale-[0.98] text-white font-bold text-xs rounded-full shadow-lg shadow-sicamp-700/25 transition-all flex items-center justify-center gap-2 mt-5">
                Daftar Akun Baru <i class="fa-solid fa-arrow-right"></i>
            </button>
        </form>

        <div class="text-center text-xs text-slate-500 mt-5 pt-4 border-t border-slate-100">
            Sudah punya akun? <a href="login.html" class="font-bold text-sicamp-700 hover:underline">Masuk di sini</a>
        </div>
    </div>

    <div id="registerToast" class="register-toast" role="status" aria-live="polite">
        <div class="flex items-start gap-3">
            <i id="registerToastIcon" class="fa-solid fa-circle-exclamation text-red-600 mt-1"></i>
            <div class="flex-1 min-w-0">
                <p id="registerToastTitle" class="text-xs font-extrabold text-slate-800">Informasi</p>
                <p id="registerToastMessage" class="mt-1 text-xs leading-relaxed text-slate-500"></p>
            </div>
            <button type="button" onclick="tutupToast()" class="text-slate-400 hover:text-slate-700" aria-label="Tutup notifikasi">
                <i class="fa-solid fa-xmark"></i>
            </button>
        </div>
    </div>

    <script>
        let toastTimer;

        function togglePassword(inputId, button) {
            const input = document.getElementById(inputId);
            const icon = button.querySelector('i');
            const tampil = input.type === 'password';
            input.type = tampil ? 'text' : 'password';
            icon.classList.toggle('fa-eye', !tampil);
            icon.classList.toggle('fa-eye-slash', tampil);
        }

        function tampilkanToast(pesan, sukses = false) {
            const toast = document.getElementById('registerToast');
            document.getElementById('registerToastTitle').textContent = sukses ? 'Pendaftaran Berhasil' : 'Pendaftaran Gagal';
            document.getElementById('registerToastMessage').textContent = pesan;
            document.getElementById('registerToastIcon').className = `fa-solid ${sukses ? 'fa-circle-check text-green-700' : 'fa-circle-exclamation text-red-600'} mt-1`;
            toast.classList.add('show');
            toast.style.borderLeft = `4px solid ${sukses ? '#15803d' : '#dc2626'}`;
            clearTimeout(toastTimer);
            toastTimer = setTimeout(tutupToast, 4000);
        }

        function tutupToast() {
            document.getElementById('registerToast').classList.remove('show');
            clearTimeout(toastTimer);
        }

        document.getElementById('regPass').addEventListener('input', function () {
            const nilai = this.value;
            const label = document.getElementById('passwordStrength');
            if (!nilai) label.textContent = 'Belum diisi';
            else if (nilai.length < 8) label.textContent = 'Terlalu pendek';
            else if (/[A-Z]/.test(nilai) && /[0-9]/.test(nilai) && /[^A-Za-z0-9]/.test(nilai)) label.textContent = 'Kuat';
            else if (/[A-Z]/.test(nilai) && /[0-9]/.test(nilai)) label.textContent = 'Sedang';
            else label.textContent = 'Perlu diperkuat';
        });

        document.getElementById('registerForm').addEventListener('submit', async function (event) {
            event.preventDefault();

            const tombol = document.getElementById('registerSubmit');
            const nama = document.getElementById('regNama').value.trim();
            const email = document.getElementById('regEmail').value.trim();
            const telepon = document.getElementById('regPhone').value.trim();
            const alamat = document.getElementById('regAlamat').value.trim();
            const password = document.getElementById('regPass').value;
            const konfirmasi = document.getElementById('regKonfirmasi').value;

            if (password.length < 8) {
                tampilkanToast('Kata sandi minimal 8 karakter.');
                return;
            }

            if (password !== konfirmasi) {
                tampilkanToast('Konfirmasi kata sandi tidak sama.');
                document.getElementById('regKonfirmasi').focus();
                return;
            }

            tombol.disabled = true;
            tombol.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Memproses...';

            try {
                const response = await fetch('api/api_auth.php?action=register', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({nama, email, telepon, alamat, password})
                });

                const hasil = await response.json();

                if (!response.ok || hasil.success === false || hasil.status === 'error') {
                    throw new Error(hasil.message || hasil.pesan || 'Pendaftaran belum berhasil.');
                }

                tampilkanToast(hasil.message || hasil.pesan || 'Akun berhasil dibuat. Silakan masuk.', true);

                setTimeout(() => {
                    window.location.href = 'login.html';
                }, 1500);
            } catch (error) {
                tampilkanToast(error.message || 'Terjadi kesalahan saat menghubungi server.');
            } finally {
                tombol.disabled = false;
                tombol.innerHTML = 'Daftar Akun Baru <i class="fa-solid fa-arrow-right"></i>';
            }
        });
    </script>
    <script src="js/app.js"></script>
</body>
</html>
