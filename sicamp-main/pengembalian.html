<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Kelola Pengembalian - Admin</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="sidebar">
        <div class="brand">OutdoorRent</div>
        <ul class="menu" id="sidebarMenu"></ul>
        <div class="user-info" id="userInfo"></div>
    </div>

    <div class="main-content">
        <div class="card">
            <h2>Proses Pengembalian Peralatan</h2>
            <table id="tblPengembalian">
                <thead>
                    <tr>
                        <th>Kode Transaksi</th>
                        <th>Pelanggan</th>
                        <th>Tanggal Kembali Rencana</th>
                        <th>Aksi</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
