<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Register Pelanggan</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container" style="max-width:450px; margin-top:3rem;">
        <div class="card">
            <h2>Pendaftaran Pelanggan</h2>
            <form id="registerForm">
                <div class="form-group">
                    <label>Nama Lengkap</label>
                    <input type="text" id="regNama" required>
                </div>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="regEmail" required>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="regPass" required>
                </div>
                <button type="submit" class="btn" style="width:100%;">Daftar Akun</button>
            </form>
            <p style="text-align:center; margin-top:1rem;">
                Sudah punya akun? <a href="login.html">Login</a>
            </p>
        </div>
    </div>
    <script src="js/app.js"></script>
</body>
</html>
