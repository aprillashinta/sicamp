<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daftar Akun Baru - SiCamp OutdoorRent</title>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        sicamp: {
                            50: '#f0fdf4',
                            100: '#dcfce7',
                            200: '#bbf7d0',
                            500: '#22c55e',
                            600: '#16a34a',
                            700: '#15803d',
                            800: '#0e622f',
                        }
                    },
                    fontFamily: {
                        sans: ['Plus Jakarta Sans', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-[#faf5f0] min-h-screen flex items-center justify-center p-4 font-sans antialiased text-slate-800">

    <div class="w-full max-w-[440px] bg-white rounded-[36px] shadow-2xl shadow-stone-200/60 p-7 sm:p-8 border border-stone-100 my-6">
        
<!-- Header Brand -->
<div class="text-center mb-5">
    <a href="index.html" class="inline-block">
        <span class="text-2xl font-black text-slate-900 tracking-tight leading-none block">
            Si<span class="text-sicamp-700">Camp</span>
        </span>
    </a>
    <p class="text-xs text-slate-500 font-medium mt-1">
        Penyewaan Peralatan Camping
    </p>
</div>

        <!-- Tab Switcher di register.html -->
        <div class="bg-[#f5efea] p-1.5 rounded-full flex items-center mb-5">
            <!-- Tab Masuk (Tidak Aktif) -->
            <a href="login.html" class="flex-1 py-2.5 text-center text-xs font-semibold text-slate-400 hover:text-slate-600 transition-colors flex items-center justify-center gap-1.5">
                <i class="fa-solid fa-right-to-bracket"></i> Masuk Akun
            </a>

            <!-- Tab Daftar Akun Baru (AKTIF & TETAP ADA LOGO) -->
            <a href="register.html" class="flex-1 py-2.5 text-center text-xs font-bold text-sicamp-800 bg-white rounded-full shadow-sm flex items-center justify-center gap-1.5">
                <i class="fa-solid fa-user-plus text-sicamp-700"></i> Daftar Akun Baru
            </a>
        </div>

        <!-- Form Register -->
        <form id="registerForm" class="space-y-4">
            <!-- Name Hidden or mapped -->
            <input type="hidden" id="regNama" value="Petualang SiCamp">

            <div>
                <label class="block text-xs font-bold text-slate-700 mb-1.5">Alamat Email <span class="text-rose-500">*</span></label>
                <div class="relative">
                    <i class="fa-regular fa-envelope absolute left-4 top-3.5 text-slate-400 text-sm"></i>
                    <input type="email" id="regEmail" required placeholder="nama@petualang.id" class="w-full pl-11 pr-4 py-3 bg-[#f7f2ed] focus:bg-white border border-transparent focus:border-sicamp-600 rounded-full text-xs font-medium text-slate-800 placeholder-slate-400 focus:outline-none transition-all">
                </div>
            </div>

            <div>
                <label class="block text-xs font-bold text-slate-700 mb-1.5">Nomor WhatsApp Aktif <span class="text-rose-500">*</span></label>
                <div class="relative flex items-center">
                    <div class="absolute left-4 text-xs font-bold text-slate-500 flex items-center gap-1">
                        <i class="fa-solid fa-mobile-screen text-slate-400"></i>
                        <span>+62</span>
                    </div>
                    <input type="tel" id="regPhone" placeholder="812-3456-7890" class="w-full pl-16 pr-4 py-3 bg-[#f7f2ed] focus:bg-white border border-transparent focus:border-sicamp-600 rounded-full text-xs font-medium text-slate-800 placeholder-slate-400 focus:outline-none transition-all">
                </div>
                <p class="text-[10px] text-slate-400 mt-1 flex items-center gap-1">
                    <i class="fa-solid fa-circle-info text-sicamp-600"></i> Untuk notifikasi status booking & kode QR pickup di hub sewa.
                </p>
            </div>

            <div>
                <label class="block text-xs font-bold text-slate-700 mb-1.5">Buat Kata Sandi <span class="text-rose-500">*</span></label>
                <div class="relative">
                    <i class="fa-solid fa-lock absolute left-4 top-3.5 text-slate-400 text-sm"></i>
                    <input type="password" id="regPass" required placeholder="Minimal 8 karakter unik" class="w-full pl-11 pr-11 py-3 bg-[#f7f2ed] focus:bg-white border border-transparent focus:border-sicamp-600 rounded-full text-xs font-medium text-slate-800 placeholder-slate-400 focus:outline-none transition-all">
                    <button type="button" onclick="togglePassword('regPass', this)" class="absolute right-4 top-3.5 text-slate-400 hover:text-slate-600 text-sm">
                        <i class="fa-regular fa-eye"></i>
                    </button>
                </div>
                <div class="flex justify-between items-center text-[10px] text-slate-400 mt-1">
                    <span>Kekuatan kata sandi</span>
                    <span class="text-slate-500 font-semibold">Belum diisi</span>
                </div>
            </div>

            <div class="pt-1">
                <label class="flex items-start gap-2 text-xs text-slate-600 cursor-pointer">
                    <input type="checkbox" required class="mt-0.5 w-3.5 h-3.5 rounded text-sicamp-700 focus:ring-sicamp-600 border-slate-300">
                    <span class="leading-tight">Saya menyetujui <a href="#" class="font-bold text-sicamp-700 hover:underline">Syarat & Ketentuan Sewa SiCamp</a> serta <a href="#" class="font-bold text-sicamp-700 hover:underline">Kebijakan Privasi</a> penggunaan data.</span>
                </label>
            </div>

            <button type="submit" class="w-full py-3.5 bg-sicamp-700 hover:bg-sicamp-800 active:scale-[0.98] text-white font-bold text-xs rounded-full shadow-lg shadow-sicamp-700/25 transition-all flex items-center justify-center gap-2 mt-2">
                Daftar Akun Baru <i class="fa-solid fa-arrow-right"></i>
            </button>
        </form>

        <!-- Footer Link -->
        <div class="text-center text-xs text-slate-500 mt-6 pt-4 border-t border-slate-100">
            Sudah punya akun? <a href="login.html" class="font-bold text-sicamp-700 hover:underline">Masuk di sini</a>
        </div>
    </div>

    <script>
        function togglePassword(inputId, btn) {
            const input = document.getElementById(inputId);
            const icon = btn.querySelector('i');
            if (input.type === 'password') {
                input.type = 'text';
                icon.classList.remove('fa-eye');
                icon.classList.add('fa-eye-slash');
            } else {
                input.type = 'password';
                icon.classList.remove('fa-eye-slash');
                icon.classList.add('fa-eye');
            }
        }
    </script>
    <script src="js/app.js"></script>
</body>
</html>
