<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Riwayat Penyewaan - SiCamp Surakarta</title>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        sicamp: {
                            50: '#f0fdf4',
                            100: '#dcfce7',
                            200: '#bbf7d0',
                            500: '#22c55e',
                            600: '#16a34a',
                            700: '#15803d',
                            800: '#0e622f',
                            900: '#0a4b23',
                        }
                    },
                    fontFamily: {
                        sans: ['Plus Jakarta Sans', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-[#f9fbf9] text-slate-800 font-sans antialiased flex flex-col min-h-screen">

    <!-- Topbar Navigation -->
    <header class="sticky top-0 z-40 bg-white/95 backdrop-blur-md border-b border-slate-100 shadow-sm">
        <div class="max-w-5xl mx-auto px-4 sm:px-6 h-20 flex items-center justify-between gap-4">
            
            <!-- Logo SiCamp -->
            <a href="index.html" class="flex items-center gap-2.5 no-underline">
                <div class="w-10 h-10 bg-sicamp-700 rounded-xl flex items-center justify-center text-white text-xl font-black shadow-md shadow-sicamp-700/20">
                    <i class="fa-solid fa-tree"></i>
                </div>
                <div>
                    <span class="text-2xl font-extrabold tracking-tight text-slate-900 block leading-none">Si<span class="text-sicamp-700">Camp</span></span>
                    <span class="text-[10px] text-slate-400 font-semibold tracking-wider uppercase">Outdoor Gear Rental</span>
                </div>
            </a>

            <!-- Navigation Links -->
            <nav class="flex items-center gap-6 text-xs font-bold text-slate-600">
                <a href="index.html#katalog" class="hover:text-sicamp-700 transition-colors flex items-center gap-1.5 no-underline">
                    <i class="fa-solid fa-store text-sicamp-700"></i> Katalog Alat
                </a>
                <a href="riwayat-sewa.html" class="text-sicamp-700 font-bold flex items-center gap-1.5 no-underline">
                    <i class="fa-solid fa-clock-rotate-left"></i> Riwayat Penyewaan
                </a>
            </nav>

            <!-- User Auth Indicator -->
            <div id="userIndicator" class="flex items-center gap-2">
                <!-- Di-render otomatis via app.js -->
            </div>
        </div>
    </header>

    <!-- Main Content Area -->
    <main class="max-w-5xl mx-auto px-4 sm:px-6 py-8 flex-grow w-full space-y-6">
        
        <!-- Header Judul -->
        <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 border-b border-slate-200/60 pb-4">
            <div>
                <h1 class="text-2xl font-extrabold text-slate-900 tracking-tight">
                    Riwayat Penyewaan Saya
                </h1>
                <p class="text-xs text-slate-500 mt-1">Daftar pesanan sewa peralatan camping dan status pembayarannya.</p>
            </div>

            <a href="index.html#katalog" class="px-4 py-2.5 bg-sicamp-700 hover:bg-sicamp-800 text-white font-bold text-xs rounded-xl shadow-md transition-all flex items-center gap-2 shrink-0 no-underline">
                <i class="fa-solid fa-plus"></i> Sewa Alat Baru
            </a>
        </div>

        <!-- Wadah Card List Pesanan Shopee-Style -->
        <div id="riwayatListContainer" class="space-y-4">
            <!-- Di-render via app.js -->
        </div>

    </main>

    <!-- Footer -->
    <footer class="bg-white border-t border-slate-200 py-6 mt-auto text-center text-xs text-slate-400">
        &copy; 2026 SiCamp Surakarta. All rights reserved.
    </footer>

    <script src="js/app.js"></script>
</body>
</html>
