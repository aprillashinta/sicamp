<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verifikasi Pembayaran - Admin SiCamp</title>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        sicamp: {
                            50: '#f0fdf4',
                            100: '#dcfce7',
                            200: '#bbf7d0',
                            500: '#22c55e',
                            600: '#16a34a',
                            700: '#15803d',
                            800: '#0e622f',
                            900: '#0a4b23',
                        }
                    },
                    fontFamily: {
                        sans: ['Plus Jakarta Sans', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-[#f9fbf9] text-slate-800 font-sans antialiased h-screen flex flex-col md:flex-row overflow-hidden">

    <!-- Sidebar Navigation -->
    <aside class="w-full md:w-64 bg-slate-900 text-slate-300 flex flex-col justify-between p-5 md:h-screen shrink-0">
        <div class="space-y-6">
            <a href="index.html" class="flex items-center gap-2.5 px-2">
                <div>
                    <span class="text-lg font-extrabold text-white block leading-none">Si<span class="text-sicamp-500">Camp</span></span>
                    <span class="text-[9px] text-slate-400 font-semibold tracking-wider uppercase">Admin Control</span>
                </div>
            </a>

            <nav>
                <ul id="sidebarMenu" class="space-y-1 text-xs font-semibold">
                    <!-- Di-render via app.js -->
                </ul>
            </nav>
        </div>

        <div class="pt-6 border-t border-slate-800 text-[11px] text-slate-400" id="userInfo">
            <!-- Info Admin -->
        </div>
    </aside>

    <!-- Main Content Area -->
    <main class="flex-1 p-6 md:p-10 overflow-y-auto h-full space-y-6">
        <div>
            <h1 class="text-2xl font-extrabold text-slate-900 tracking-tight">
                Verifikasi Pembayaran Pelanggan
            </h1>
            <p class="text-xs text-slate-500 mt-1">Periksa kelengkapan bukti transfer pembayaran sewa alat dari pelanggan.</p>
        </div>

        <!-- Tabel Verifikasi -->
        <div class="bg-white rounded-2xl border border-slate-200/80 shadow-sm overflow-hidden">
            <div class="overflow-x-auto">
                <table id="tblVerifikasi" class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-slate-50 text-slate-700 text-[11px] font-extrabold uppercase tracking-wider border-b border-slate-200">
                            <th class="py-4 px-6">Kode TRX</th>
                            <th class="py-4 px-6">Pelanggan</th>
                            <th class="py-4 px-6">Total Harga</th>
                            <th class="py-4 px-6">Status</th>
                            <th class="py-4 px-6 text-center">Tindakan Admin</th>
                        </tr>
                    </thead>
                    <tbody class="divide-y divide-slate-100 text-xs font-medium text-slate-700">
                        <!-- Content di-render via JS -->
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <script src="js/app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            renderUserNavigation();
            renderTabelVerifikasiAdmin();
        });

        function renderTabelVerifikasiAdmin() {
            const tbody = document.querySelector('#tblVerifikasi tbody');
            if (!tbody) return;

            const penyewaan = JSON.parse(localStorage.getItem('penyewaan')) || [];
            tbody.innerHTML = '';

            const pendingList = penyewaan.filter(p => p.status === 'Menunggu Verifikasi' || p.status === 'Menunggu Pembayaran');

            if (pendingList.length === 0) {
                tbody.innerHTML = `
                    <tr>
                        <td colspan="5" class="py-12 text-center text-slate-400">
                            <i class="fa-solid fa-circle-check text-4xl mb-2 block text-emerald-500"></i>
                            Tidak ada pembayaran yang membutuhkan verifikasi saat ini.
                        </td>
                    </tr>
                `;
                return;
            }

            penyewaan.forEach((p, idx) => {
                if (p.status === 'Menunggu Verifikasi' || p.status === 'Menunggu Pembayaran') {
                    tbody.innerHTML += `
                        <tr class="hover:bg-slate-50 transition-colors">
                            <td class="py-4 px-6 font-bold text-slate-900">${p.kode_transaksi}</td>
                            <td class="py-4 px-6">${p.nama_pelanggan || 'Pelanggan'}</td>
                            <td class="py-4 px-6 font-bold text-sicamp-700">Rp ${(p.total_harga || 0).toLocaleString('id-ID')}</td>
                            <td class="py-4 px-6">
                                <span class="bg-amber-100 text-amber-800 border border-amber-200 text-[10px] font-bold px-2.5 py-1 rounded-full inline-block">
                                    ${p.status}
                                </span>
                            </td>
                            <td class="py-4 px-6 text-center">
                                <div class="flex items-center justify-center gap-2">
                                    <button onclick="prosesVerifikasi(${idx}, 'Disetujui')" class="px-3.5 py-1.5 bg-sicamp-700 hover:bg-sicamp-800 text-white font-bold text-[11px] rounded-xl shadow-sm transition-all flex items-center gap-1">
                                        <i class="fa-solid fa-check"></i> Setujui
                                    </button>
                                    <button onclick="prosesVerifikasi(${idx}, 'Ditolak')" class="px-3.5 py-1.5 bg-rose-50 hover:bg-rose-600 hover:text-white text-rose-600 font-bold text-[11px] rounded-xl border border-rose-200 transition-all flex items-center gap-1">
                                        <i class="fa-solid fa-xmark"></i> Tolak
                                    </button>
                                </div>
                            </td>
                        </tr>
                    `;
                }
            });
        }

        function prosesVerifikasi(index, statusBaru) {
            const penyewaan = JSON.parse(localStorage.getItem('penyewaan')) || [];
            if (penyewaan[index]) {
                penyewaan[index].status = statusBaru;
                localStorage.setItem('penyewaan', JSON.stringify(penyewaan));
                alert(`Status transaksi ${penyewaan[index].kode_transaksi} berhasil diubah menjadi: ${statusBaru}`);
                renderTabelVerifikasiAdmin();
            }
        }
    </script>
</body>
</html>
