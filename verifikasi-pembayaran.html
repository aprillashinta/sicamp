<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verifikasi Pembayaran - Admin SiCamp</title>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        sicamp: {
                            50: '#f0fdf4',
                            100: '#dcfce7',
                            200: '#bbf7d0',
                            500: '#22c55e',
                            600: '#16a34a',
                            700: '#15803d',
                            800: '#0e622f',
                            900: '#0a4b23',
                        }
                    },
                    fontFamily: {
                        sans: ['Plus Jakarta Sans', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-[#f9fbf9] text-slate-800 font-sans antialiased h-screen flex flex-col md:flex-row overflow-hidden">

    <!-- Sidebar Navigation -->
    <aside class="w-full md:w-64 bg-slate-900 text-slate-300 flex flex-col justify-between p-5 md:h-screen shrink-0">
        <div class="space-y-6">
            <a href="index.html" class="flex items-center gap-2.5 px-2">
                <div>
                    <span class="text-lg font-extrabold text-white block leading-none">Si<span class="text-sicamp-500">Camp</span></span>
                    <span class="text-[9px] text-slate-400 font-semibold tracking-wider uppercase">Admin Control</span>
                </div>
            </a>

            <nav>
                <ul id="sidebarMenu" class="space-y-1 text-xs font-semibold">
                    <!-- Di-render via app.js -->
                </ul>
            </nav>
        </div>

        <div class="pt-6 border-t border-slate-800 text-[11px] text-slate-400" id="userInfo">
            <!-- Info Admin -->
        </div>
    </aside>

    <!-- Main Content Area -->
    <main class="flex-1 p-6 md:p-10 overflow-y-auto h-full space-y-6">
        <div>
            <h1 class="text-2xl font-extrabold text-slate-900 tracking-tight">
                Verifikasi Pembayaran Pelanggan
            </h1>
            <p class="text-xs text-slate-500 mt-1">Periksa kelengkapan bukti transfer pembayaran sewa alat dari pelanggan.</p>
        </div>

        <!-- Tabel Verifikasi -->
        <div class="bg-white rounded-2xl border border-slate-200/80 shadow-sm overflow-hidden">
            <div class="overflow-x-auto">
                <table id="tblVerifikasi" class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-slate-50 text-slate-700 text-[11px] font-extrabold uppercase tracking-wider border-b border-slate-200">
                            <th class="py-4 px-6">Kode TRX</th>
                            <th class="py-4 px-6">Pelanggan</th>
                            <th class="py-4 px-6">Total Harga</th>
                            <th class="py-4 px-6">Bukti Transfer</th>
                            <th class="py-4 px-6">Status</th>
                            <th class="py-4 px-6 text-center">Tindakan Admin</th>
                        </tr>
                    </thead>
                    <tbody class="divide-y divide-slate-100 text-xs font-medium text-slate-700">
                        <!-- Content di-render via JS -->
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <!-- Modal Bukti Transfer -->
    <div id="modalBukti" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl max-w-lg w-full p-6 shadow-2xl relative">
            <button onclick="closeModalBukti()" class="absolute top-4 right-4 text-slate-400 hover:text-slate-600 text-lg">
                <i class="fa-solid fa-xmark"></i>
            </button>
            <h3 class="text-base font-bold text-slate-900 mb-4 flex items-center gap-2">
                <i class="fa-solid fa-file-invoice-dollar text-sicamp-600"></i> Bukti Transfer Pelanggan
            </h3>
            <div class="bg-slate-100 rounded-xl overflow-hidden flex items-center justify-center min-h-[250px] border border-slate-200">
                <img id="imgBukti" src="" alt="Bukti Transfer" class="max-h-[400px] w-auto object-contain">
            </div>
        </div>
    </div>

    <script src="js/app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            if (typeof renderUserNavigation === 'function') renderUserNavigation();
            loadVerifikasiPembayaran();
        });

        // Ambil data dari Backend PHP / API
        async function loadVerifikasiPembayaran() {
            const tbody = document.querySelector('#tblVerifikasi tbody');
            if (!tbody) return;

            tbody.innerHTML = `
                <tr>
                    <td colspan="6" class="py-12 text-center text-slate-400">
                        <i class="fa-solid fa-spinner fa-spin text-2xl mb-2 text-sicamp-600"></i>
                        <p class="text-xs">Memuat data pembayaran...</p>
                    </td>
                </tr>
            `;

            try {
                // Ambil data penyewaan dari API PHP
                const res = await fetch('api/api_penyewaan.php?action=get_all');
                const data = await res.json();

                if (data.status === 'success' && data.data.length > 0) {
                    // Filter yang butuh verifikasi saja
                    const pendingList = data.data.filter(p => 
                        p.status === 'Menunggu Verifikasi' || p.status === 'Menunggu Pembayaran'
                    );

                    if (pendingList.length === 0) {
                        renderEmptyState(tbody);
                        return;
                    }

                    tbody.innerHTML = '';
                    pendingList.forEach(p => {
                        const buktiImg = p.bukti_transfer ? `uploads/${p.bukti_transfer}` : null;

                        tbody.innerHTML += `
                            <tr class="hover:bg-slate-50/80 transition-colors">
                                <td class="py-4 px-6 font-bold text-slate-900">${p.kode_transaksi}</td>
                                <td class="py-4 px-6">${p.nama_pelanggan || 'Pelanggan'}</td>
                                <td class="py-4 px-6 font-bold text-sicamp-700">Rp ${parseInt(p.total_harga || 0).toLocaleString('id-ID')}</td>
                                <td class="py-4 px-6">
                                    ${buktiImg ? `
                                        <button onclick="showBukti('${buktiImg}')" class="text-sicamp-600 hover:text-sicamp-800 underline font-semibold text-[11px] flex items-center gap-1">
                                            <i class="fa-regular fa-image"></i> Lihat Foto
                                        </button>
                                    ` : '<span class="text-slate-400 italic">Belum Upload</span>'}
                                </td>
                                <td class="py-4 px-6">
                                    <span class="bg-amber-100 text-amber-800 border border-amber-200 text-[10px] font-bold px-2.5 py-1 rounded-full inline-block">
                                        ${p.status}
                                    </span>
                                </td>
                                <td class="py-4 px-6 text-center">
                                    <div class="flex items-center justify-center gap-2">
                                        <button onclick="prosesVerifikasi('${p.id_penyewaan}', 'Disetujui')" class="px-3.5 py-1.5 bg-sicamp-700 hover:bg-sicamp-800 text-white font-bold text-[11px] rounded-xl shadow-sm transition-all flex items-center gap-1">
                                            <i class="fa-solid fa-check"></i> Setujui
                                        </button>
                                        <button onclick="prosesVerifikasi('${p.id_penyewaan}', 'Ditolak')" class="px-3.5 py-1.5 bg-rose-50 hover:bg-rose-600 hover:text-white text-rose-600 font-bold text-[11px] rounded-xl border border-rose-200 transition-all flex items-center gap-1">
                                            <i class="fa-solid fa-xmark"></i> Tolak
                                        </button>
                                    </div>
                                </td>
                            </tr>
                        `;
                    });
                } else {
                    renderEmptyState(tbody);
                }
            } catch (err) {
                console.error(err);
                tbody.innerHTML = `
                    <tr>
                        <td colspan="6" class="py-8 text-center text-rose-500 font-semibold text-xs">
                            Gagal terhubung ke API backend server.
                        </td>
                    </tr>
                `;
            }
        }

        function renderEmptyState(tbody) {
            tbody.innerHTML = `
                <tr>
                    <td colspan="6" class="py-12 text-center text-slate-400">
                        <i class="fa-solid fa-circle-check text-4xl mb-2 block text-emerald-500"></i>
                        Tidak ada pembayaran yang membutuhkan verifikasi saat ini.
                    </td>
                </tr>
            `;
        }

        // Fungsi Update Status ke Backend API
        async function prosesVerifikasi(idPenyewaan, statusBaru) {
            if (!confirm(`Apakah Anda yakin ingin mengubah status transaksi ini menjadi '${statusBaru}'?`)) return;

            try {
                const res = await fetch('api/api_penyewaan.php?action=update_status', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        id_penyewaan: idPenyewaan,
                        status: statusBaru
                    })
                });
                const result = await res.json();

                if (result.status === 'success') {
                    alert(`Status transaksi berhasil diperbarui menjadi: ${statusBaru}`);
                    loadVerifikasiPembayaran();
                } else {
                    alert(`Gagal: ${result.message || 'Terjadi kesalahan'}`);
                }
            } catch (err) {
                alert('Terjadi kesalahan koneksi ke server.');
            }
        }

        // Functions Modal Bukti
        function showBukti(src) {
            document.getElementById('imgBukti').src = src;
            document.getElementById('modalBukti').classList.remove('hidden');
        }

        function closeModalBukti() {
            document.getElementById('modalBukti').classList.add('hidden');
        }
    </script>
</body>
</html>
